name: Build & Test

on:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need formatting:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -count=1

      - name: Test with race detector
        run: go test ./... -race -count=1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Coverage
        run: |
          go test ./... -coverprofile=coverage.out -count=1
          go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            goos: linux
            arch: amd64
          - os: linux
            goos: linux
            arch: arm64
          - os: windows
            goos: windows
            arch: amd64
          - os: windows
            goos: windows
            arch: arm64
          - os: macos
            goos: darwin
            arch: amd64
          - os: macos
            goos: darwin
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          env GOOS=${{ matrix.goos }} GOARCH=${{ matrix.arch }} \
            go build -ldflags="-s -w" -o "./bin/t-browser-${{ matrix.os }}-${{ matrix.arch }}${ext}"

      - name: Install UPX (Compress binary)
        if: matrix.goos != 'darwin'
        continue-on-error: true
        run: |
          sudo apt update
          sudo apt install -y upx-ucl
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          upx --best "./bin/t-browser-${{ matrix.os }}-${{ matrix.arch }}${ext}" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: t-browser-${{ matrix.os }}-${{ matrix.arch }}
          path: ./bin/t-browser-${{ matrix.os }}-${{ matrix.arch }}*
          retention-days: 30
