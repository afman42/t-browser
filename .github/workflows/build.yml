name: Build & Test

on:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Get dependencies
        run: go mod tidy

      - name: Lint
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Get dependencies
        run: go mod tidy

      - name: Test
        run: go test ./... -v -count=1

      - name: Test with race detector
        run: go test ./... -race -count=1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Get dependencies
        run: go mod tidy

      - name: Coverage
        run: |
          go test ./... -coverprofile=coverage.out -count=1
          go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows]
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Get dependencies
        run: go mod tidy

      - name: Build
        run: |
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then ext=".exe"; fi
          env GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -ldflags="-s -w" -o "./bin/t-browser-${{ matrix.os }}-${{ matrix.arch }}${ext}"

      - name: Install UPX (Compress file)
        run: |
          sudo apt update
          sudo apt install -y upx-ucl
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then ext=".exe"; fi
          upx ./bin/t-browser-${{ matrix.os }}-${{ matrix.arch }}${ext}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: t-browser-${{ matrix.os }}-${{ matrix.arch }}
          path: ./bin/t-browser-${{ matrix.os }}-${{ matrix.arch }}*
